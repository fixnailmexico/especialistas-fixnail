<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Especialistas FixNail</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#153047;background:#edf7f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 10% 5%,#b9f2e9,transparent 38%),linear-gradient(135deg,#e9f6ff,#f8fcfd)}main{width:min(100%,470px);background:white;border-radius:22px;box-shadow:0 18px 55px #123a5030;overflow:hidden}.hero{padding:32px;background:linear-gradient(120deg,#102d49,#157c7d);color:white}.hero small{color:#a9f3e8;font-weight:700;letter-spacing:.07em}.hero h1{margin:9px 0;font-size:29px}.hero p{margin:0;color:#e2f4f6}.content{padding:28px}label{display:block;font-weight:650;font-size:14px;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #b6cbd3;border-radius:10px;font:inherit}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:13px 17px;font-weight:700}button.primary{background:#087d80;color:white;width:100%;margin-top:20px}button.link{background:transparent;color:#087d80;padding:10px 0}button:disabled{opacity:.55;cursor:wait}.status{margin-top:14px;font-size:14px;line-height:1.5;min-height:20px}.status.error{color:#a72d2d}.status.ok{color:#076b5b}.panel{background:#edf8f7;border-radius:12px;padding:18px;margin-top:14px}.muted{color:#58717b;font-size:13px}.hidden{display:none}footer{text-align:center;padding:0 20px 22px;color:#6a8088;font-size:12px}
</style></head><body><main><header class="hero"><small>FIXNAIL · SISTEMA SUMHA</small><h1>Especialistas FixNail</h1><p>Acceso exclusivo para profesionales autorizados</p></header><section class="content"><div id="loginView"><form id="loginForm"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required placeholder="tu@correo.com"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Tu contraseña"><button id="loginBtn" class="primary" type="submit">Iniciar sesión</button></form><button id="resetBtn" class="link" type="button">¿Olvidaste tu contraseña?</button><div id="loginStatus" class="status" role="status" aria-live="polite"></div></div><div id="panelView" class="hidden"><h2 id="welcome">Bienvenido</h2><div class="panel"><strong id="roleLabel"></strong><p id="panelInfo"></p></div><p class="muted">La gestión de especialistas y los expedientes clínicos se habilitarán después de configurar sus controles de seguridad.</p><button id="logoutBtn" class="primary" type="button">Cerrar sesión</button><div id="panelStatus" class="status" role="status" aria-live="polite"></div></div></section><footer>Comunidad FixNail · Acceso controlado mediante Firebase</footer></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDUsPwRWbLVembMu5LuOtmF1g6o1yLqcLc',authDomain:'comunidad-fixnail.firebaseapp.com',projectId:'comunidad-fixnail',storageBucket:'comunidad-fixnail.firebasestorage.app',messagingSenderId:'41816935364',appId:'1:41816935364:web:90f2428e4df6b02f0eb291',measurementId:'G-9FYLFVK2ZK'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),setStatus=(id,msg,error=false)=>{const e=$(id);e.textContent=msg;e.className='status '+(error?'error':'ok')};
const loginForm=$('loginForm'),loginBtn=$('loginBtn');
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginBtn.disabled=true;setStatus('loginStatus','Verificando acceso…');try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(err){setStatus('loginStatus','No se pudo iniciar sesión. Revisa tu correo y contraseña.',true)}finally{loginBtn.disabled=false}});
$('resetBtn').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){setStatus('loginStatus','Primero escribe tu correo electrónico.',true);return}try{await sendPasswordResetEmail(auth,email);setStatus('loginStatus','Si el correo corresponde a una cuenta válida, revisa tu bandeja de entrada para restablecer la contraseña.')}catch(err){setStatus('loginStatus','No se pudo enviar la solicitud. Revisa el correo e inténtalo nuevamente.',true)}});
$('logoutBtn').addEventListener('click',()=>signOut(auth));
onAuthStateChanged(auth,async user=>{if(!user){$('loginView').classList.remove('hidden');$('panelView').classList.add('hidden');return}setStatus('loginStatus','Verificando autorización…');try{const snap=await getDoc(doc(db,'usuarios',user.uid));const profile=snap.exists()?snap.data():null;if(!profile||profile.activo!==true||!['administrador','especialista'].includes(profile.rol)){await signOut(auth);setStatus('loginStatus','Tu cuenta no tiene autorización activa. Contacta a un administrador.',true);return}if(auth.currentUser?.uid!==user.uid)return;$('welcome').textContent='Bienvenido a Especialistas FixNail';$('roleLabel').textContent=profile.rol==='administrador'?'Cuenta de administrador':'Cuenta de especialista';$('panelInfo').textContent='Sesión autorizada: '+(user.email||'');$('loginView').classList.add('hidden');$('panelView').classList.remove('hidden')}catch(err){await signOut(auth);setStatus('loginStatus','No se pudo verificar la autorización. Comprueba la conexión y las reglas de Firestore.',true)}});
</script></body></html>
